# ── Upstream pool ─────────────────────────────────────────────────────────────
upstream notify_surge {
    least_conn;          # Route to instance with fewest active connections

    server app1:3000;    # Docker service names resolve as hostnames
    server app2:3000;

    # Keep 32 idle TCP connections to upstream open
    # Avoids TCP handshake overhead on every request
    keepalive 32;
}

# ── Server block ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # Security headers — second layer on top of Helmet in Express
    add_header X-Frame-Options   "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;
    # Remove the upstream server info from responses
    proxy_hide_header X-Powered-By;

    # ── Proxy defaults (applied to all locations) ──────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection      "";            # Enable keepalives to upstream
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;  # Real client IP
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # ── /health — no rate limit, no access log ─────────────────────────────
    location = /health {
        access_log  off;
        proxy_pass  http://notify_surge;
    }

    # ── /auth — strict zone (5 req/s, burst 5) ────────────────────────────
    # Guards against brute-force login attempts at the network layer
    # before the request even reaches Express
    location /auth/ {
        limit_req  zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://notify_surge;
    }

    # ── /notifications/broadcast — tightest limit (2 req/s, burst 2) ──────
    location /notifications/broadcast {
        limit_req  zone=broadcast burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://notify_surge;
    }

    # ── All other routes — general API zone ───────────────────────────────
    location / {
        limit_req  zone=api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://notify_surge;
    }
}