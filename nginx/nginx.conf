# One worker per CPU core — auto-detect
worker_processes auto;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
    # Accept all pending connections at once (not one at a time)
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access log
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile    on;  # Zero-copy file transfers
    tcp_nopush  on;  # Batch TCP packets
    tcp_nodelay on;  # No Nagle delay on keepalive connections
    keepalive_timeout 65;

    # Gzip — compresses JSON responses by ~70%
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        application/json text/plain application/javascript;

    # ── Rate limiting zones ───────────────────────────────────────────────
    # Defined here (global), enforced per-route in conf.d/
    # $binary_remote_addr = client IP (4 bytes binary, more efficient than string)
    # 10m = 10MB of memory for tracking IPs (~160,000 IPs per MB)

    # General API: 30 req/sec per IP
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

    # Auth + sensitive: 5 req/sec per IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Broadcast: 2 req/sec per IP
    limit_req_zone $binary_remote_addr zone=broadcast:10m rate=2r/s;

    # Hide Nginx version in error pages and Server header
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}